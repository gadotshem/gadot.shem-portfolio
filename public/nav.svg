<svg xmlns="http://www.w3.org/2000/svg" viewBox="130 65 915 270" width="915" height="270" fill="none">
    <!-- Playhead Needle Line -->
    <line x1="328" y1="85" x2="328" y2="305" stroke="#707b88" stroke-width="5.5" />

    <!-- Track 1: Top Layer (Light Muted Slate) -->
    <rect x="238" y="118" width="232" height="60" fill="#a2adb9" rx="2" />

    <!-- Track 2: Middle Layer (Mid Slate Gray) -->
    <rect x="172" y="178" width="248" height="60" fill="#47505c" rx="2" />

    <!-- Track 3: Bottom Layer (Dark Charcoal) -->
    <rect x="202" y="238" width="260" height="60" fill="#2b313b" rx="2" />

    <!-- Playhead Scrubber Pin (Top Pentagon Marker) -->
    <polygon points="314,72 342,72 342,92 328,107 314,92" fill="#1e242c" />

    <!-- Sequences Typography -->
    <text x="495" y="238" font-family="Inter" font-size="146" font-weight="700" fill="#212529" letter-spacing="-3">Sequences</text>
    
    <!-- by Shem. Subtitle -->
    <text x="715" y="315" font-family="Inter" font-size="74" font-weight="700" fill="#212529" letter-spacing="-1.5">by Shem.</text>
