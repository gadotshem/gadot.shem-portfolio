<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- Background Canvas -->
  <rect width="512" height="512" rx="100" fill="#cbd3db" />
  
  <!-- Playhead Needle Line (Behind Scrubber Pin, through all tracks) -->
  <line x1="256" y1="170" x2="256" y2="356" stroke="#707b88" stroke-width="5.5" />

  <!-- Track 1: Top Layer (Light Muted Slate) -->
  <rect x="176" y="182" width="222" height="58" fill="#a2adb9" rx="2" />

  <!-- Track 2: Middle Layer (Mid Slate Gray) -->
  <rect x="114" y="240" width="235" height="58" fill="#47505c" rx="2" />

  <!-- Track 3: Bottom Layer (Dark Charcoal) -->
  <rect x="142" y="298" width="248" height="58" fill="#2b313b" rx="2" />

  <!-- Playhead Scrubber Pin (Top Pentagon Marker) -->
  <polygon points="242,141 270,141 270,161 256,176 242,161" fill="#1e242c" />
</svg>
